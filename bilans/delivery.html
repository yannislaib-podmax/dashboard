<title>PodMax · Bilan hebdo Delivery</title>

<style>
:root{
  --violet:#7B2FF7;--violet2:#9B6BFF;--magenta:#E619B0;--ciel:#C9A6FF;
  --nuit:#0B0714;--nuit2:#170F28;--verre:rgba(255,255,255,.06);--bord:rgba(255,255,255,.12);
  --txt:rgba(255,255,255,.90);--txt2:rgba(255,255,255,.62);--vert:#6FD3A3;--ambre:#F0B95A;--rouge:#FF5C7A;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:var(--nuit);color:var(--txt);font-family:var(--sans);min-height:100vh;padding:0 0 60px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(55vw 55vw at 90% -8%,rgba(123,47,247,.40),transparent 60%),
   radial-gradient(45vw 45vw at -8% 40%,rgba(230,25,176,.20),transparent 60%),
   radial-gradient(40vw 40vw at 100% 90%,rgba(111,211,163,.10),transparent 60%),
   linear-gradient(180deg,var(--nuit),var(--nuit2));}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px}
.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0 8px}
.top img{height:30px;display:block}
.top span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt2)}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:stretch;margin:26px 0 8px}
.kicker{font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ciel);margin-bottom:14px}
h1{font-size:clamp(2.4rem,5.4vw,4.4rem);line-height:1.03;font-weight:800;letter-spacing:-.025em}
.grad{background:linear-gradient(90deg,var(--violet2),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.range{margin-top:16px;font-size:1.05rem;color:var(--txt2)}
.pill{display:inline-block;margin-top:22px;padding:8px 16px;border-radius:999px;background:linear-gradient(135deg,var(--violet),var(--magenta));font-size:.8rem;font-weight:600}
.sample{display:inline-block;margin-left:10px;padding:7px 14px;border-radius:999px;border:1px dashed var(--ambre);color:var(--ambre);font-size:.75rem;font-weight:600}
.glass{background:var(--verre);border:1px solid var(--bord);border-radius:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.headline{padding:26px 28px;display:flex;flex-direction:column;justify-content:center;gap:18px;background:linear-gradient(145deg,rgba(123,47,247,.35),rgba(230,25,176,.22));border:1px solid rgba(255,255,255,.18)}
.headline .row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:14px}
.headline .row:last-child{border:0;padding-bottom:0}
.headline .l{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.headline .v{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.headline .c{font-size:.8rem;font-weight:700;margin-left:10px}
h2{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:700;letter-spacing:-.015em;margin:48px 0 6px}
.sub{color:var(--txt2);font-size:.92rem;margin-bottom:22px;max-width:46em}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.insc{padding:22px 24px;position:relative;overflow:hidden}
.insc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.insc .t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;margin-bottom:8px}
.insc .t i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.insc p{font-size:.9rem;color:var(--txt2);line-height:1.55}
.insc p b{color:#fff}
.gt{display:flex;align-items:center;gap:10px;margin:30px 0 14px;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.gt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--c),transparent);opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.kpi{padding:20px 22px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:var(--c);opacity:.16;filter:blur(24px)}
.kpi.star{border:1px solid var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 12px 40px color-mix(in srgb,var(--c) 28%,transparent)}
.kt{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.kv{font-size:2.15rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kd{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--txt2);margin-top:6px}
.chip{font-weight:700;font-size:.75rem;border-radius:999px;padding:3px 10px}
.chip.good{background:rgba(111,211,163,.16);color:var(--vert)}
.chip.bad{background:rgba(255,92,122,.16);color:var(--rouge)}
.chip.flat{background:rgba(255,255,255,.08);color:var(--txt2)}
.spark{display:block;margin:2px 0 6px}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{padding:24px 26px}
.panel h3{font-size:1.02rem;font-weight:700;margin-bottom:4px}
.panel .hint{font-size:.8rem;color:var(--txt2);margin-bottom:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--txt2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
svg text{font-family:var(--sans)}
.funnel .fr{display:grid;grid-template-columns:150px 1fr 120px;gap:14px;align-items:center;margin:12px 0}
.funnel .n{font-size:.9rem;font-weight:600}
.funnel .b{height:36px;border-radius:12px;background:linear-gradient(90deg,var(--violet),var(--magenta));display:flex;align-items:center;padding-left:14px;font-weight:800;box-shadow:0 6px 22px rgba(123,47,247,.35);min-width:48px}
.funnel .cv{font-size:.8rem;color:var(--txt2)}
.funnel .cv b{color:var(--vert);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);font-weight:600;text-align:right;padding:10px 10px;border-bottom:1px solid var(--bord)}
.tbl td{text-align:right;padding:14px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl .nm{font-weight:600;display:flex;align-items:center;gap:10px}
.tbl .nm i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.tbl .cash{min-width:170px}
.tbl .cash .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
.tbl .cash .bar span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet2),var(--magenta))}
.tbl tr.tot td{font-weight:800;border-bottom:0;background:rgba(255,255,255,.05)}
.tbl tr.tot td:first-child{border-radius:12px 0 0 12px}.tbl tr.tot td:last-child{border-radius:0 12px 12px 0}
.al{display:flex;gap:16px;align-items:flex-start;padding:18px 22px;margin-bottom:12px;position:relative;overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.al i{font-style:normal;font-size:1.3rem}
.al b{color:#fff}
.al p{font-size:.92rem;color:var(--txt2);line-height:1.55}
.foot{margin-top:46px;font-size:.76rem;color:var(--txt2);line-height:1.8;text-align:center}
.foot b{color:var(--ciel)}
@media (max-width:900px){.hero,.two,.eq,.ins{grid-template-columns:1fr}.funnel .fr{grid-template-columns:100px 1fr}.funnel .cv{grid-column:1/-1}.tbl{display:block;overflow-x:auto}}
@page{size:A4;margin:8mm}
@media print{
  html{background:#0B0714}
  body{padding:0;min-height:0;background:linear-gradient(180deg,#0B0714,#170F28)}
  body::before{display:none}
  .wrap{max-width:none;padding:0 6px}
  .glass,.panel,.kpi,.insc,.al,.fr,.tbl tr,.hero{break-inside:avoid;page-break-inside:avoid}
  h2,.gt{break-after:avoid;page-break-after:avoid}
  .grid{break-inside:auto}
  .spark,svg{max-width:100%}
}
</style>

/*DATA_START*/

const $ = (id)=>document.getElementById(id);
const fm=(v,d)=>{const s=Math.abs(v).toFixed(d);const p=s.split('.');let i=p[0],g='';while(i.length>3){g=' '+i.slice(-3)+g;i=i.slice(0,-3)}return (v<0?'-':'')+i+g+(p[1]?','+p[1]:'')};
function chip(d,better,t){
  if(d==null) return '<span class="chip flat">—</span>';
  const a=Math.abs(d); let cls='flat'; if(a>=1){cls=((d>0)===(better==='up'))?'good':'bad'}
  const arrow=d>0?'▲':d<0?'▼':'■', sign=d>0?'+':d<0?'−':'';
  return `<span class="chip ${cls}">${arrow} ${sign}${a}${t==='pts'?' pts':''}</span>`;
}
function spark(arr,color){
  const w=190,h=40,mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>[6+i*(w-12)/(arr.length-1), h-6-((v-mn)/rg)*(h-14)]);
  const line=pts.map(p=>p.join(',')).join(' '), id='g'+Math.random().toString(36).slice(2,8), last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="40" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="6,${h} ${line} ${w-6},${h}" fill="url(#${id})"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.6" fill="${color}" stroke="#0B0714" stroke-width="1.5"/></svg>`;
}
function ring(p,color){const r=27,c=2*Math.PI*r,d=c*p/100;return `<svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle cx="35" cy="35" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 35 35)" style="filter:drop-shadow(0 0 6px ${color})"/></svg>`}
function kpi(k,color){
  const vis=k.ring!=null?ring(k.ring,color):'';
  const sp=(k.ring==null&&k.sp)?spark(k.sp,color):'<div style="height:46px"></div>';
  return `<div class="glass kpi ${k.hero?'star':''}" style="--c:${color}"><div class="kt">${k.icon?`<span>${k.icon}</span>`:''}<span>${k.l}</span></div><div class="kv"><span>${k.v}</span>${vis}</div>${k.ring!=null?'<div style="height:6px"></div>':sp}<div class="kd"><span>vs S-1</span>${chip(k.d1,k.better,k.t)}</div><div class="kd"><span>vs moy. 4 sem.</span>${chip(k.d4,k.better,k.t)}</div></div>`;
}
function daily(){
  const D=DATA.daily,W=600,H=250,l=24,r=24,t=26,b=34,n=7,step=(W-l-r)/n,bw=20,mx=Math.max(1,...D.created,...D.delivered)*1.35;
  const y=v=>(v/mx)*(H-b-t);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0.25,0.5,0.75,1].forEach(f=>{const yy=H-b-f*(H-b-t);s+=`<line x1="${l}" y1="${yy}" x2="${W-r}" y2="${yy}" stroke="rgba(255,255,255,.07)"/>`});
  DATA.days.forEach((d,i)=>{const cx=l+step*i+step/2,base=H-b;
    s+=`<rect x="${cx-bw-2}" y="${base-y(D.created[i])}" width="${bw}" height="${y(D.created[i])}" rx="7" fill="#9B6BFF"/><rect x="${cx+2}" y="${base-y(D.delivered[i])}" width="${bw}" height="${y(D.delivered[i])}" rx="7" fill="#6FD3A3"/>`;
    if(D.created[i])s+=`<text x="${cx-bw/2-2}" y="${base-y(D.created[i])-6}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${D.created[i]}</text>`;
    if(D.delivered[i])s+=`<text x="${cx+bw/2+2}" y="${base-y(D.delivered[i])-6}" font-size="11" font-weight="700" fill="#6FD3A3" text-anchor="middle">${D.delivered[i]}</text>`;
    s+=`<text x="${cx}" y="${H-12}" font-size="11" fill="rgba(255,255,255,.6)" text-anchor="middle">${d}</text>`});
  return s+'</svg>';
}
function stages(){
  const S=DATA.stages,mx=Math.max(1,...S.filter(x=>!x.done).map(x=>x.count))*1.15;
  return S.map((s,i)=>`<div class="fr"><div class="n">${s.icon} ${s.n}<div style="font-size:.72rem;color:var(--txt2);font-weight:400">${s.hint}</div></div><div><div class="b" style="width:${Math.min(100,Math.max(8,s.count/mx*100))}%;${s.done?'background:linear-gradient(90deg,#2FB27E,#6FD3A3);':'opacity:'+(1-i*0.05)+';'}">${s.count}</div></div><div class="cv">${s.age==null?'<b style="color:var(--vert)">terminé</b>':`âge moyen <b style="color:#fff">${fm(s.age,1)} j</b>`}${s.blocked?` · <b style="color:var(--rouge)">${s.blocked} bloqué${s.blocked>1?'s':''}</b>`:''}</div></div>`).join('');
}
function cps(){
  const C=DATA.cps,mx=Math.max(1,...C.map(x=>x.packs));
  return C.map(c=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px"><span style="font-weight:600">${c.n}</span><span><b>${c.packs}</b> pack${c.packs>1?'s':''}${c.blocked?` · <b style="color:var(--rouge)">${c.blocked} bloqué${c.blocked>1?'s':''}</b>`:''}</span></div><div style="height:10px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:${c.packs/mx*100}%;border-radius:8px;background:linear-gradient(90deg,${c.n==='Sans CP'?'#FF5C7A,#F0B95A':'#7B2FF7,#E619B0'})"></div></div></div>`).join('');
}
function trend(T){
  const W=330,H=170,l=24,r=24,t=30,b=30,p=T.pts,n=p.length,rg=(Math.max(...p)-Math.min(...p))||1,mn=Math.min(...p)-rg*.25,mx=Math.max(...p)+rg*.25;
  const x=i=>l+i*(W-l-r)/(n-1),y=v=>H-b-((v-mn)/(mx-mn))*(H-b-t),avg=p.slice(0,n-1).reduce((a,c)=>a+c,0)/(n-1);
  const good=T.better==='down'?p[n-1]<=avg:p[n-1]>=avg,col=good?'#6FD3A3':'#FF5C7A',id='t'+Math.random().toString(36).slice(2,7);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><line x1="${l}" y1="${y(avg)}" x2="${W-r}" y2="${y(avg)}" stroke="#F0B95A" stroke-dasharray="4 4" opacity=".7"/><text x="${W-r}" y="${y(avg)-6}" font-size="9.5" fill="#F0B95A" text-anchor="end">moy. 4 sem.</text><polygon points="${x(0)},${H-b} ${p.map((v,i)=>x(i)+','+y(v)).join(' ')} ${x(n-1)},${H-b}" fill="url(#${id})"/><polyline points="${p.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  p.forEach((v,i)=>{const last=i===n-1;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?6:4}" fill="${last?col:'#0B0714'}" stroke="${col}" stroke-width="2.4"/><text x="${x(i)}" y="${y(v)-12}" font-size="${last?12:10}" font-weight="${last?800:500}" fill="${last?'#fff':'rgba(255,255,255,.7)'}" text-anchor="middle">${fm(v,Math.abs(v-Math.round(v))<0.05?0:1)}</text><text x="${x(i)}" y="${H-10}" font-size="10" fill="rgba(255,255,255,.55)" text-anchor="middle">${DATA.weeks[i]||''}</text>`});
  return `<div class="glass panel"><h3>${T.t}</h3>${s}</svg></div>`;
}
function blocked(){
  if(!DATA.blocked.length)return '<div style="padding:22px;color:var(--txt2)">Aucun pack bloqué cette semaine. 🎉</div>';
  return `<table class="tbl"><tr><th>Client</th><th>Pack</th><th>Étape</th><th>Sans mouvement</th><th>CP</th><th>Prochaine action</th></tr>${DATA.blocked.map(b=>`<tr><td><b>${b.client}</b></td><td>${b.pack}</td><td>${b.stage}</td><td><span class="chip bad">${b.days} j</span></td><td>${b.cp}</td><td style="text-align:left;color:var(--txt2)">${b.next}</td></tr>`).join('')}</table>`;
}
function render(){
  const W=DATA.week,col={good:'#6FD3A3',warn:'#F0B95A',bad:'#FF5C7A'},ico={good:'🚀',warn:'⚠️',bad:'🚨'};
  let h=`<div class="hero"><div><div class="kicker">Reporting hebdomadaire · Delivery</div><h1>Semaine <span class="grad">${W.num}</span></h1><div class="range">${W.label}</div><span class="pill">Généré automatiquement · ${W.generated}</span>${DATA.sample?'<span class="sample">Données d\'exemple</span>':''}</div><div class="glass headline">${DATA.headline.map(x=>`<div class="row"><span class="l">${x.l}</span><span><span class="v">${x.v}</span><span class="c" style="color:${x.good?'#6FD3A3':'#FF5C7A'}">${x.c}</span></span></div>`).join('')}</div></div>`;
  h+=`<h2>La semaine en un coup d'œil</h2><p class="sub">Rédigé automatiquement à partir des chiffres : ce qui va bien, ce qu'il faut surveiller, ce qui coince.</p><div class="ins">${DATA.insights.map(i=>`<div class="glass insc" style="--c:${col[i.type]}"><div class="t"><i>${ico[i.type]}</i>${i.title}</div><p>${i.text}</p></div>`).join('')}</div>`;
  h+=`<h2>Les chiffres de la semaine</h2><p class="sub">Les flux sont comparés à la semaine précédente (S-1) et à la moyenne des 4 dernières semaines. Les photos de l'instant (packs en production, risques) sont comparées aux relevés des lundis précédents quand ils existent.</p>`;
  DATA.groups.forEach(g=>{h+=`<div class="gt" style="--c:${g.color}">${g.icon} ${g.title}</div><div class="grid">${g.items.map(k=>kpi(k,g.color)).join('')}</div>`});
  h+=`<h2>Pipeline de production</h2><p class="sub">Tous les statuts du pipeline, de À démarrer à Livré : combien de packs, depuis combien de temps.</p><div class="two"><div class="glass panel funnel">${stages()}</div><div class="glass panel"><h3>Charge par chef de projet</h3><div class="hint">Packs en production par CP</div>${cps()}</div></div>`;
  h+=`<h2>Jour par jour</h2><p class="sub">Commandes et livraisons de la semaine.</p><div class="glass panel"><h3>Nouveaux packs et packs livrés</h3><div class="hint">Par jour, du lundi au dimanche</div>${daily()}<div class="legend"><span><i style="background:#9B6BFF"></i>Nouveaux packs</span><span><i style="background:#6FD3A3"></i>Packs livrés</span></div></div>`;
  h+=`<h2>Tendance sur 5 semaines</h2><p class="sub">La ligne pointillée est la moyenne des 4 semaines précédentes.</p><div class="ins">${DATA.trend.map(trend).join('')}</div>`;
  h+=`<h2>Packs bloqués</h2><p class="sub">Aucun changement de statut depuis 5 jours ou plus.</p><div class="glass panel" style="padding:14px 18px">${blocked()}</div>`;
  h+=`<h2>Points d'attention</h2><p class="sub">Alertes générées automatiquement quand un seuil est franchi.</p>${DATA.alerts.map(a=>`<div class="glass al" style="--c:${a.c}"><i>${a.i}</i><div><b>${a.t}</b><p>${a.x}</p></div></div>`).join('')}`;
  $('app').innerHTML=h;
  $('foot').innerHTML=`Packs en production = tous les statuts entre À démarrer (exclu) et Livré (exclu) · Bloqué = aucun changement de statut depuis 5 jours ou plus<br>Délai de livraison = de la commande du pack à son passage en Livré · Semaine du lundi au dimanche, heure de Paris<br><b>PODMAX</b> · rapport généré automatiquement`;
}
/* ===== CHARGEMENT =====
   - ?semaine=2026-S48 (ou ?live=1) : charge les vrais chiffres depuis /api/bilan-delivery
   - sinon : affiche DATA tel qu'embarqué (données d'exemple ou JSON injecté par Make)
   window.__BILAN_READY passe à true quand le rendu est terminé (attendu par le PDF). */
(function(){
  const q=new URLSearchParams(location.search);
  const fin=()=>{window.__BILAN_READY=true;document.documentElement.setAttribute('data-ready','1')};
  if(q.has('semaine')||q.has('live')){
    const u='/api/bilan-delivery'+(q.get('semaine')?'?semaine='+encodeURIComponent(q.get('semaine')):'');
    fetch(u).then(r=>r.json()).then(j=>{
      if(j.erreur)throw new Error(j.erreur);
      Object.assign(DATA,j.data||j);DATA.sample=false;render();fin();
    }).catch(e=>{document.getElementById('app').innerHTML='<div style="padding:40px;color:#FF5C7A">Impossible de charger le bilan : '+String(e.message||e)+'</div>';fin()});
  }else{render();fin()}
})();
</script>
</body>
